name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test_smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deterministic gate suite
        run: python3 scripts/test_smoke.py
